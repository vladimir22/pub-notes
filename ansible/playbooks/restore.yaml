---
- name: "Restore Actions"
  hosts: localhost
  connection: local
  vars:
  - KUBECONFIG: ~/.kube/config
  tasks:
  - name: Print ENVs
    debug:
      msg: "KUBECONFIG: {{ KUBECONFIG }}"


  - name: Shutdown postgres-operator
    kubernetes.core.k8s: ## https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html#examples
      state: patched
      kind: Deployment
      name: pgo-postgres-operator
      namespace: pgo
      definition:
        spec:
          replicas: 0


  - name: Restore secrets,configmaps,postgresql
    ## https://docs.ansible.com/ansible/latest/collections/ansible/builtin/shell_module.html#examples
    ansible.builtin.shell: velero restore create --from-backup sa --include-namespaces 'sa' --include-resources 'secrets,configmaps,postgresqls.acid.zalan.do'
    register: cmd_out
  - name: Print cmd_out
    debug:
      msg: "cmd_out: {{ cmd_out }}"    


  - name: Patch postgresql
    kubernetes.core.k8s:
      state: patched
      definition:
        apiVersion: acid.zalan.do/v1
        kind: postgresql
        metadata:
          name: postgres-db-site-a
          namespace: sa
        spec:
          clone: ## Clone from S3: https://github.com/zalando/postgres-operator/blob/master/docs/user.md#clone-from-s3
            #uid: "efd12e58-5786-11e8-b5a7-06148230260c"
            cluster: "postgres-db-site-a"
            timestamp: "2022-10-17T14:30:01+00:00"            
            s3_wal_path: "s3://foundation-pf/spilo/postgres-db-site-a"
            s3_endpoint: http://storage-minio.s3.svc.cluster.local:9000
            s3_access_key_id: minio
            s3_secret_access_key: minio123
            s3_force_path_style: true


  - name: Run postgres-operator
    kubernetes.core.k8s: ## https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_module.html#examples
      state: patched
      kind: Deployment
      name: pgo-postgres-operator
      namespace: pgo
      definition:
        spec:
          replicas: 1




